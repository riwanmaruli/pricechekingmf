<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta charset="UTF-8">
<title>PRICE CHECKING TRANSMART MEDAN FAIR</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e31837">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:url('https://ik.imagekit.io/goodid/nyc/goodstats/uploads/articles/original/2022/07/25/supermarket-dengan-gerai-terbanyak-di-indonesia-2021-4GLGDeNKM2.jpg?tr=w-1200,h-630,fo-center') center/cover no-repeat fixed;
}
.overlay{
  background:rgba(0,0,0,0.55);
  min-height:100vh;
  padding:16px 0;
}
.container{
  width:360px;
  max-width:92%;
  margin:auto;
  background:#fff;
  padding:18px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.logo{width:170px;margin-bottom:6px;}
.title{font-weight:bold;font-size:18px;margin-bottom:6px;}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ccc;
  text-align:center;
  font-size:16px;
  box-sizing:border-box;
}
#reader{
  width:350px;        /* +25% BIGGER */
  max-width:100%;
  height:260px;       /* +25% BIGGER */
  margin:14px auto;
  position:relative;
  border:3px dashed #bbb;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  overflow:hidden;
  background:#fff;
}
.placeholder{
  position:absolute;
  text-align:center;
  color:#888;
  font-size:14px;
  pointer-events:none;
}
.scanline{
  position:absolute;
  left:0; right:0;
  height:3px;
  background:red;
  animation:scan 2s linear infinite;
  display:none;
}
@keyframes scan{
  0%{top:0}
  50%{top:94%}
  100%{top:0}
}
.result{
  margin-top:12px;
  padding:18px;
  border-radius:12px;
  background:#fafafa;
}
.harga{
  font-size:36px;
  font-weight:bold;
  background:#ffd400;
  padding:6px 12px;
  border-radius:8px;
  display:inline-block;
}
</style>
</head>

<body>
<div class="overlay">
  <div class="container">

    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Transmart.svg/960px-Transmart.svg.png">

    <div class="title">PRICE CHECKING TRANSMART MEDAN FAIR</div>

    <input id="barcode" placeholder="Scan atau ketik barcode"
      inputmode="numeric" pattern="[0-9]*">

    <div id="reader">
      <div class="placeholder" id="placeholder">
        TAP DI SINI<br>UNTUK SCAN BARCODE
      </div>
      <div class="scanline" id="scanline"></div>
    </div>

    <div id="hasil"></div>

  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzGsZf77mHFUbso_BMUKzGO3C7TIorsR8-5C2RI5-jTNWimv62qeMQhiq3D8uu90UADag/exec";

let scanner=null;
let scanning=false;

function beep(){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  o.frequency.value=900;
  o.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+0.1);
}

function tampil(data){
  if(!data || !data.nama){
    hasil.innerHTML="<div class='result'>Barang tidak ditemukan</div>";
  }else{
    hasil.innerHTML=`<div class="result">
      <div>${data.nama}</div>
      <div class="harga">Rp ${data.harga}</div>
      <div>Stock: ${data.stock}</div>
    </div>`;
  }
}

async function cari(code){
  try{
    const r=await fetch(API+"?barcode="+code);
    tampil(await r.json());
  }catch{
    tampil(null);
  }
}

function startScan(){

  if(scanning) return;

  scanning=true;
  placeholder.style.display="none";
  scanline.style.display="block";

  scanner=new Html5Qrcode("reader");

  scanner.start(
    {facingMode:"environment"},
    {fps:18,qrbox:260},
    txt=>{
      beep();
      barcode.value=txt;
      cari(txt);

      scanner.stop().then(()=>{
        scanner=null;
        scanning=false;
        scanline.style.display="none";
        placeholder.style.display="block";
      });
    }
  );
}

reader.addEventListener("click", startScan);

barcode.addEventListener("change",()=>{
  cari(barcode.value);
  barcode.blur();
});
</script>

</body>
</html>
