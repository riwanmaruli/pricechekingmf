<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>Cek Harga Transmart</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:url("https://ik.imagekit.io/goodid/nyc/goodstats/uploads/articles/original/2022/07/25/supermarket-dengan-gerai-terbanyak-di-indonesia-2021-4GLGDeNKM2.jpg?tr=w-1200,h-630,fo-center") center/cover no-repeat fixed;
}

.overlay{
  backdrop-filter:blur(6px);
  background:rgba(0,0,0,0.25);
  min-height:100vh;
  padding-top:25px;
}

.container{
  width:360px;   /* diperlebar */
  max-width:92%;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  text-align:center;
}

.logoimg{
  width:180px;
  margin-bottom:10px;
}

.subtitle{
  color:#777;
  margin-bottom:15px;
  font-size:14px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#e31837;
  color:white;
  font-weight:bold;
  font-size:16px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:1px solid #ccc;
  text-align:center;
  font-size:16px;
  margin-bottom:10px;
}

#reader{ margin-top:10px; }

.result{
  margin-top:15px;
  padding:22px;
  border-radius:14px;
  background:#fafafa;
  box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

.nama{ font-size:19px; margin-bottom:10px; }

.harga{
  font-size:40px;
  font-weight:bold;
  color:#e31837;
}

.stock{ margin-top:6px; color:#555; }

</style>
</head>

<body>

<div class="overlay">
<div class="container">

<!-- LOGO TRANSMART ASLI -->
<img class="logoimg"
src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Transmart.svg">

<div class="subtitle">PRICE CHECKING</div>

<button onclick="startScanner()"> SCAN </button>

<input id="barcode" placeholder="Masukkan Barcode Manual">
<button onclick="cari()">CEK MANUAL</button>

<div id="reader"></div>
<div id="hasil"></div>

</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyRhOqgMlJTMNcyz8Wzm-gq1Yf9Pp7NCd7ZlRUCdZ88wTILNhCKhZo4xcvfkwW0Dhe6/exec";

let scanner;
let resetTimer;

/* bunyi beep */
function beep(){
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator();
  o.frequency.value=950;
  o.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime+0.12);
}

function resetLayar(){

  clearTimeout(resetTimer);

  resetTimer=setTimeout(()=>{
    document.getElementById("hasil").innerHTML="";
    document.getElementById("barcode").value="";
  },5000); // reset 5 detik
}

function tampil(data){

  if(!data.nama){
    document.getElementById("hasil").innerHTML=
      "<div class='result'>Barang tidak ditemukan</div>";
    resetLayar();
    return;
  }

  document.getElementById("hasil").innerHTML=
  `<div class="result">
      <div class="nama">${data.nama}</div>
      <div class="harga">Rp ${data.harga}</div>
      <div class="stock">Stock: ${data.stock}</div>
   </div>`;

  resetLayar();
}

function cari(){

  let code=document.getElementById("barcode").value.trim();
  if(!code) return;

  fetch(API+"?barcode="+code)
  .then(r=>r.json())
  .then(tampil);
}

function startScanner(){

  if(scanner) return;

  scanner=new Html5Qrcode("reader");

  scanner.start(
    {facingMode:"environment"},
    {fps:12, qrbox:250},

    (decodedText)=>{

      beep();

      document.getElementById("barcode").value=decodedText;

      fetch(API+"?barcode="+decodedText)
      .then(r=>r.json())
      .then(tampil);

    }
  );
}

/* AUTO SCAN SAAT HALAMAN DIBUKA */
window.onload = function(){
  startScanner();
};

</script>

</body>
</html>
